[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medicine-image-preprocessing"
version = "1.0.0"
requires-python = ">=3.10,<3.11"
dependencies = [
  "numpy>=1.24,<3",
  "opencv-python-headless>=4.8,<5",
  "Pillow>=10,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
yolo = ["ultralytics>=8.3,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"medicine_preprocess.data" = ["quality_thresholds_v2.json", "best.pt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
